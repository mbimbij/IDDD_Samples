allprojects {
    apply plugin: 'java-library'
}

subprojects {
    repositories {
        mavenLocal()
        mavenCentral()

        // JBoss Repo
        maven { url 'https://repository.jboss.org/nexus/content/groups/public-jboss/' }
    }

    dependencies {
        api platform("org.springframework.boot:spring-boot-dependencies:4.1.0")
        testImplementation platform("org.springframework.boot:spring-boot-dependencies:4.1.0")

        api "org.slf4j:slf4j-api"
        testImplementation "junit:junit"
    }
}

project(':iddd_common') {

    dependencies {
        api "com.google.code.gson:gson"
        api "com.rabbitmq:amqp-client"
        api "org.hibernate.orm:hibernate-core"
        api "org.iq80.leveldb:leveldb:0.12"
        api "org.springframework:spring-context"
        api "org.springframework:spring-orm"
        api "org.springframework:spring-tx"

        implementation "commons-logging:commons-logging"
        implementation "jakarta.transaction:jakarta.transaction-api"
        implementation "org.apache.commons:commons-dbcp2"
        implementation "org.aspectj:aspectjweaver"
        runtimeOnly "com.mysql:mysql-connector-j"

        testImplementation "jakarta.persistence:jakarta.persistence-api"
    }
}

project(':iddd_identityaccess') {
    dependencies {
        implementation project(':iddd_common')
        implementation "jakarta.ws.rs:jakarta.ws.rs-api"
        implementation "org.aspectj:aspectjweaver"
        implementation "org.springframework:spring-context"
        implementation "org.springframework:spring-tx"
        runtimeOnly "com.mysql:mysql-connector-j"

        testImplementation files(this.project(':iddd_common').sourceSets.test.output)
        testImplementation "jakarta.persistence:jakarta.persistence-api"
        testImplementation "jakarta.servlet:jakarta.servlet-api"
        testImplementation "org.jboss.resteasy:resteasy-client:7.0.2.Final"
        testImplementation "org.jboss.resteasy:resteasy-undertow:7.0.2.Final"
    }
}

project(':iddd_collaboration') {
    dependencies {
        implementation project(':iddd_common')
        implementation "jakarta.ws.rs:jakarta.ws.rs-api"
        implementation "org.apache.commons:commons-dbcp2"
        implementation "org.jboss.resteasy:resteasy-client:7.0.2.Final"
        runtimeOnly "com.mysql:mysql-connector-j"

        testImplementation files(this.project(':iddd_common').sourceSets.test.output)
        testImplementation "jakarta.persistence:jakarta.persistence-api"
    }
}

project(':iddd_agilepm') {
    dependencies {
        implementation project(':iddd_common')

        testImplementation files(this.project(':iddd_common').sourceSets.test.output)
    }
}
